services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beesupport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beesupport}
      POSTGRES_DB: ${POSTGRES_DB:-beesupport}
      TZ: Asia/Shanghai
    # 默认映射到 55432，避免与宿主机已有 PostgreSQL 冲突
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-beesupport} -d ${POSTGRES_DB:-beesupport}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  ops:
    profiles: [tools]
    build:
      context: .
      dockerfile: Dockerfile.ops
    environment:
      RECOVERY_DATABASE_URL: ${RECOVERY_DATABASE_URL:-}
    volumes:
      - uploads:/source-uploads:ro
      - ${BACKUP_DIR:-./backups}:/backups

  app:
    image: ${APP_IMAGE:-beesupport:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      BIND_HOST: "0.0.0.0"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Asia/Shanghai}
      AUTH_SECRET: ${AUTH_SECRET:?请在 .env 中设置 AUTH_SECRET}
      ADMIN_PATH: ${ADMIN_PATH:-/admin}
      DATABASE_URL: postgresql://${POSTGRES_USER:-beesupport}:${POSTGRES_PASSWORD:-beesupport}@postgres:5432/${POSTGRES_DB:-beesupport}?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/data/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-20971520}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # 微信扫码登录：凭证文件也放 uploads 卷里，重启不用重新扫码
      WECHATBOT_ENABLED: ${WECHATBOT_ENABLED:-}
      WECHATBOT_STORAGE_DIR: /app/data/uploads/wechatbot
      WECHATBOT_DEFAULT_TO: ${WECHATBOT_DEFAULT_TO:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/data/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/ready', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  pgdata:
  redisdata:
  uploads:
