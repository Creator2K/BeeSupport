name: Publish BeeSupport image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image metadata
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a release tag such as v1.2.0."
            exit 1
          fi
          {
            echo "APP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "AUTH_SECRET=$(openssl rand -hex 48)"
          } >> "$GITHUB_ENV"

      - name: Build frontend and backend into one image
        shell: bash
        run: |
          docker build --platform linux/amd64 --tag "$APP_IMAGE" \
            --build-arg "RELEASE_VERSION=$GITHUB_REF_NAME" \
            --build-arg "RELEASE_COMMIT=$(git rev-parse HEAD)" \
            --build-arg "RELEASE_BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" .

      - name: Verify production startup and deployment history
        shell: bash
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready
          curl --fail --silent --show-error http://127.0.0.1:3000/login -o /tmp/beesupport-login.html
          grep -q '/_next/static/' /tmp/beesupport-login.html

          versions() {
            docker compose exec -T postgres psql -XAt -v ON_ERROR_STOP=1 -U beesupport -d beesupport \
              -c 'SELECT "version" FROM "ReleaseDeployment" ORDER BY "id";'
          }
          test "$(versions)" = "$GITHUB_REF_NAME"

          admin_password="$(openssl rand -hex 20)"
          docker compose exec -T -e SMOKE_ADMIN_PASSWORD="$admin_password" app node - <<'NODE'
          const { PrismaClient } = require("@prisma/client");
          const bcrypt = require("bcryptjs");
          const db = new PrismaClient();
          async function prepare() {
            await db.user.create({
              data: {
                email: "release-smoke@example.test",
                name: "Release smoke admin",
                role: "ADMIN",
                passwordHash: await bcrypt.hash(process.env.SMOKE_ADMIN_PASSWORD, 10),
              },
            });
            await db.site.create({
              data: {
                name: "Release smoke widget",
                slug: "release-smoke",
                publicKey: "release-smoke",
                widgetSettings: { launcherDraggable: true },
              },
            });
          }
          prepare().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          }).finally(() => db.$disconnect());
          NODE
          curl --fail --silent --show-error -c /tmp/beesupport-cookies.txt \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"release-smoke@example.test\",\"password\":\"$admin_password\"}" \
            http://127.0.0.1:3000/api/auth/login -o /dev/null
          curl --fail --silent --show-error -b /tmp/beesupport-cookies.txt -H 'Accept-Language: zh-CN' \
            http://127.0.0.1:3000/admin/releases -o /tmp/beesupport-releases.html
          grep -Fq "当前版本 $GITHUB_REF_NAME" /tmp/beesupport-releases.html
          grep -Fq "版本说明" /tmp/beesupport-releases.html
          grep -Fq "部署历史" /tmp/beesupport-releases.html
          curl --fail --silent --show-error 'http://127.0.0.1:3000/api/widget/config?key=release-smoke' |
            jq -e '.site.launcherDraggable == true'

          previous_image="$APP_IMAGE"
          next_version=v0.0.0
          if [[ "$GITHUB_REF_NAME" = "$next_version" ]]; then next_version=v0.0.1; fi
          docker build --build-arg "BASE_IMAGE=$previous_image" --build-arg "VERSION=$next_version" \
            --tag beesupport:upgrade-test - <<'DOCKERFILE'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          ARG VERSION
          USER root
          RUN node -e 'const fs = require("node:fs"); const path = "release.json"; const release = JSON.parse(fs.readFileSync(path)); release.version = process.argv[1]; fs.writeFileSync(path, JSON.stringify(release));' "$VERSION"
          USER node
          DOCKERFILE

          dependencies="$(docker compose ps -q postgres redis)"
          APP_IMAGE=beesupport:upgrade-test docker compose up -d --no-deps --no-build --wait --wait-timeout 180 app
          test "$(versions)" = "$(printf '%s\n%s' "$GITHUB_REF_NAME" "$next_version")"
          docker compose up -d --no-deps --no-build --wait --wait-timeout 180 app
          docker compose up -d --no-deps --no-build --force-recreate --wait --wait-timeout 180 app
          test "$(versions)" = "$(printf '%s\n%s\n%s' "$GITHUB_REF_NAME" "$next_version" "$GITHUB_REF_NAME")"
          test "$(docker compose ps -q postgres redis)" = "$dependencies"

      - name: Collect startup logs on failure
        if: failure()
        run: docker compose logs --no-color app

      - name: Publish the verified image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$APP_IMAGE"
          printf '`%s`\n' "$APP_IMAGE" >> "$GITHUB_STEP_SUMMARY"
